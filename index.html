<title>우리집 짐노트</title>

<meta name="mobile-web-app-capable" content="yes">

<style>
/* 레이아웃: 폰 우선 단일 컬럼(최대 600px), 상단 고정 헤더, 하단 탭바. 구성원마다 원판 색으로 앱이 물듦 */
:root{
  --bg:#eef1ef; --surface:#ffffff; --sunk:#e3e8e5; --ink:#141a1c; --muted:#5a666a; --line:#d3dad6;
  --red:#cf3b33; --yellow:#d99a12; --blue:#2c66c7; --green:#25905a; --violet:#7a4fc0; --slate:#4f5d63;
  --good:#1f8a50; --warn:#b7791f; --bad:#c2372f;
  --me:var(--slate); --me-ink:#ffffff;
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"Barlow Condensed","IBM Plex Sans KR",system-ui,sans-serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#101416; --surface:#192024; --sunk:#222a2f; --ink:#e7eceb; --muted:#97a3a7; --line:#2d363b;
  --red:#ee5f56; --yellow:#f0b43a; --blue:#5b8fe8; --green:#3fbf7d; --violet:#a07ae0; --slate:#8a9aa1;
  --good:#3fbf7d; --warn:#e6a83a; --bad:#ee5f56; --me-ink:#0d1112; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%;display:block}
[hidden]{display:none!important}
.wrap{max-width:600px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:24px} h2{font-size:20px} h3{font-size:16px}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
.lbl{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--me);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding-block:10px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-size:21px}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer}
.plate{width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--c) 70%,#000 30%);flex:none}
.plate.sm{width:14px;height:14px;box-shadow:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px 5px 5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.chip.add{padding:5px 14px;color:var(--muted)}

main{display:flex;flex-direction:column;gap:14px;padding-block:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.hero{border-color:var(--me);box-shadow:inset 4px 0 0 var(--me)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--me);border-color:var(--me);color:var(--me-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted)}
.pill.me{background:color-mix(in srgb,var(--me) 16%,transparent);color:var(--ink)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.notice{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;color:var(--muted);font-size:14px}
.empty{text-align:center;padding:24px 12px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px 0;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.weekdots{display:flex;gap:6px}
.weekdots span{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.weekdots span.on{background:var(--c,var(--me));border-color:var(--c,var(--me));color:var(--me-ink)}
.weekdots span.today{border-color:var(--ink)}
.fam{display:flex;flex-direction:column;gap:10px}
.famrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c,var(--me));border-radius:99px}
.recov{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.recov div{background:var(--sunk);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}

.daylist{display:flex;flex-direction:column;gap:10px}
.exline{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-top:1px solid var(--line);padding-top:6px}
.exline .num{white-space:nowrap}

.ex{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.ex.done{border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.exhead{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--sunk)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:center}
.set .idx{font-family:var(--f-num);font-weight:700;color:var(--muted);text-align:center}
.field{display:flex;align-items:center;background:var(--sunk);border-radius:8px;padding:0 10px;min-width:0}
.field input{border:0;background:transparent;width:100%;padding:9px 0;font-family:var(--f-num);font-weight:700;font-size:19px;min-width:0}
.field span{font-size:12px;color:var(--muted);white-space:nowrap}
.check{width:44px;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:18px}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}

.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:12;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 10px 8px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.timer .num{font-size:24px}
.timer button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:13px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{position:relative;background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600}
.tabbar svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"] svg{color:var(--me)}
.dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}

form.prof{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
form.prof .full{grid-column:1/-1}
.fl{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl label{font-size:12px;color:var(--muted);font-weight:600}
.fl input,.fl select,.fl textarea{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.fl textarea{min-height:64px;resize:vertical}
.editrow{display:grid;grid-template-columns:minmax(0,1fr) 48px 88px 64px 28px;gap:6px;align-items:center;font-size:13px}
.editrow input{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:6px 4px;width:100%;min-width:0;font-family:var(--f-num);font-weight:700;font-size:16px;text-align:center}
.editrow .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px}
.edithead{font-size:11px;color:var(--muted)}

.search{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.glist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gitem{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.gitem img,.gitem .noimg{width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--sunk)}
.gitem .noimg{display:grid;place-items:center;color:var(--muted);font-size:12px}
.gitem div{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pics figure{margin:0;display:flex;flex-direction:column;gap:4px}
.pics img{width:100%;border-radius:8px;background:#fff;aspect-ratio:3/2;object-fit:contain}
.pics figcaption{font-size:12px;color:var(--muted);text-align:center}
ol.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:100%;max-width:600px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}

.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--me) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex:none}
.ring span{width:76px;height:76px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:28px}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:1;min-width:0}
.stat{background:var(--sunk);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.stat .num{font-size:22px;line-height:1.1}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.badge b{font-size:13px}
.badge .ico{font-family:var(--f-display);font-size:20px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.badge.on .ico{background:var(--me);color:var(--me-ink)}
.badge:not(.on){opacity:.55}

.post{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px}
.post .who2{display:flex;align-items:center;gap:8px}
.reacts{display:flex;gap:6px;flex-wrap:wrap}
.react{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:15px;display:flex;gap:4px;align-items:center}
.react[aria-pressed="true"]{border-color:var(--me);background:color-mix(in srgb,var(--me) 12%,transparent)}
.msgs{display:flex;flex-direction:column;gap:6px}
.msg{background:var(--sunk);border-radius:10px;padding:6px 10px;font-size:14px}
.msgin{display:flex;gap:6px}
.msgin input{flex:1;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 10px}
.restday{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;padding:8px 2px}
.wtable{display:grid;grid-template-columns:72px repeat(7,minmax(0,1fr)) 40px;gap:4px;align-items:center;font-size:12px}
.wtable .h{color:var(--muted);text-align:center}
.wtable .c{height:28px;border-radius:6px;background:var(--sunk);display:grid;place-items:center;font-size:11px;font-weight:600}
.wtable .c.on{background:var(--c);color:#fff}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--sunk)}
.heat i.on{background:var(--me)}
.log{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);z-index:40;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600;max-width:90vw;text-align:center}
.login{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:16px}
.code{font-family:var(--f-num);font-weight:700;font-size:30px;letter-spacing:.25em;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;width:100%}
.pickname{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pickname button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:16px}
@media (min-width:720px){.recov{grid-template-columns:repeat(6,minmax(0,1fr))}.glist{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const parseD=s=>{const[a,b,c]=String(s).slice(0,10).split('-').map(Number);return new Date(a,(b||1)-1,c||1)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const roundTo=(v,inc)=>inc?Math.max(0,Math.round(v/inc)*inc):0;
const fmtN=v=>{const n=+v;return Number.isInteger(n)?String(n):n.toFixed(1).replace(/\.0$/,'')};
const clone=o=>JSON.parse(JSON.stringify(o));
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const md=s=>{const d=parseD(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+DOW[d.getDay()]+')'};
function unitOf(id){const e=EX[id];if(!e)return'';if(e.k==='time')return'초';if(e.k==='bw')return'회';if(e.k==='assist')return'보조kg';return e.per?'kg·한손':'kg'}
function targetText(it){const e=EX[it.ex];if(!e)return'';const reps=e.k==='time'?`${it.min}~${it.max}초`:`${it.min}~${it.max}회`;
  if(e.k==='load')return`${fmtN(it.weight)}kg${e.per?'(한손)':''} · ${it.sets}×${reps}`;

function ageF(a){a=+a;if(!a)return 1;if(a<16)return .7;if(a<18)return .8;if(a<40)return 1;if(a<50)return .9;if(a<60)return .85;return .75}

function estStart(id,p){const e=EX[id];const lf=(LEVELF[p.level]||1)*ageF(p.age);const bw=bodyW(p);const f=p.sex==='여'?1:0;
  if(e.k==='load')return Math.max(e.inc,roundTo(bw*e.r[f]*lf,e.inc));
  if(e.k==='assist')return roundTo(Math.max(0,bw*e.r[f]-(lf-1)*.25*bw),e.inc);
  return 0}
function genRule(p){
  const days=Math.min(5,Math.max(2,+p.days||3));const g=GOALS[p.goal]||GOALS['균형·체력'];const mins=+p.minutes||60;
  const n=mins<=40?4:mins<=50?5:mins<=60?6:7;const home=p.env==='홈(덤벨·맨몸)';const age=+p.age||0;
  const beg=p.level==='초급'||(age&&age<18);const older=age>=55;
  const out=TPL[days].map(([key,title,list])=>{const used=new Set();const items=[];
    for(let id of list){
      if(beg&&EX[id].beg)id=EX[id].beg;
      if(home&&!['덤벨','맨몸'].includes(EX[id].eq))id=EX[id].alt||id;
      if(home&&!['덤벨','맨몸'].includes(EX[id].eq))continue;
      if(used.has(id)||!EX[id])continue;used.add(id);
      const e=EX[id];const acc=e.p==='코어'||e.k==='bw'||e.k==='time'||['cable_er','db_er','rev_wrist','face_pull','lat_raise','calf_raise','calf_bw','hip_abd'].includes(id);
      let min=acc?10:g.min,max=acc?15:g.max;if((beg||older)&&p.goal==='근력'&&!acc){min=8;max=10}
      if(e.k==='time'){min=beg?20:30;max=beg?30:45}
      items.push({ex:id,sets:acc?Math.min(3,g.sets):g.sets,min,max,weight:estStart(id,p),rest:(acc?60:g.rest)+(older?15:0),est:true});
      if(items.length>=n)break}
    return{key,title,focus:'',items,warmup:older?'실내자전거 7분 + 관절 돌리기·동적 스트레칭 5분':'실내자전거 5분 + 동적 스트레칭 3분',finisher:p.goal==='체지방 감량'?'인터벌 15분 (빠르게 30초 + 천천히 90초)':'가벼운 유산소 10분 + 정적 스트레칭 5분'}});
  const notes=['시작 무게는 체중·수준·나이로 추정한 값이에요. 첫 회차에 마지막 2~3회가 힘든 무게로 조정하세요.'];
  if(age&&age<18)notes.push('성장기라 최대 무게 테스트는 하지 말고 자세 위주로 진행하세요.');
  if(older)notes.push('휴식을 15초 늘렸고, 관절 워밍업을 길게 잡았어요.');
  return{title:`${p.goal||'균형·체력'} · 주 ${days}회`,source:'rule',startDate:today(),ramp:beg,days:out,notes:notes.join(' ')}}

/* ---------- 점진적 증량 ---------- */
function progress(it,entry){
  const e=EX[it.ex];const done=entry.sets.filter(s=>s.done);if(!done.length||!e)return null;
  const reps=done.map(s=>+s.r||0);const top=done.length>=entry.sets.length&&reps.every(r=>r>=it.max);const miss=reps.filter(r=>r<it.min).length>done.length/2;
  const n=clone(it);delete n.est;let msg='유지',tone='';
  if(e.k==='load'||e.k==='assist'){const good=done.filter(s=>(+s.r||0)>=it.min).map(s=>+s.w||0);const base=good.length?Math.max(...good):(+done[0].w||0);n.weight=base;
    if(e.k==='load'){if(top){n.weight=roundTo(base+e.inc,e.inc);msg=`+${fmtN(e.inc)}kg`;tone='good'}else if(miss){n.weight=Math.max(e.inc,roundTo(base-e.inc,e.inc));msg=`-${fmtN(e.inc)}kg`;tone='bad'}}
    else{if(top){n.weight=Math.max(0,base-e.inc);msg=`보조 -${e.inc}kg`;tone='good'}else if(miss){n.weight=base+e.inc;msg=`보조 +${e.inc}kg`;tone='bad'}}}
  else if(e.k==='time'){if(top){n.min+=5;n.max+=5;msg='+5초';tone='good'}}
  else if(top&&n.max<25){n.min+=2;n.max+=2;msg='+2회';tone='good'}
  return{item:n,msg,tone}}

function bestBefore(id,ex,beforeTs){let b=null;logsOf(id).forEach(l=>{if(l.ts>=beforeTs)return;(l.entries||[]).forEach(en=>{if(en.ex!==ex)return;en.sets.forEach(s=>{const w=+s.w||0;if(EX[ex]?.k==='load'&&w>0&&(b==null||w>b))b=w})})});return b}
function prsOf(id,sinceTs){const out=[];logsOf(id).filter(l=>l.ts>=sinceTs).forEach(l=>(l.entries||[]).forEach(en=>{if(EX[en.ex]?.k!=='load')return;const w=Math.max(0,...en.sets.map(s=>+s.w||0));const b=bestBefore(id,en.ex,l.ts);if(b!=null&&w>b)out.push({ex:en.ex,w,prev:b,date:l.date})}));return out}
function ach(id){
  const logs=logsOf(id);const t=targetDays(id);const ms=monday(new Date());
  const wk=logs.filter(l=>parseD(l.date)>=ms).length;const weekPct=Math.min(100,Math.round(wk/t*100));
  const since=addDays(new Date(),-27);since.setHours(0,0,0,0);const l28=logs.filter(l=>parseD(l.date)>=since);
  const attend=Math.min(100,Math.round(l28.length/(t*4)*100));
  let done=0,plan=0;l28.forEach(l=>{done+=(l.entries||[]).reduce((a,e)=>a+e.sets.length,0);plan+=+l.planned||(l.entries||[]).reduce((a,e)=>a+e.sets.length,0)});
  const completion=plan?Math.min(100,Math.round(done/plan*100)):0;
  let streak=0;for(let i=wk>=t?0:1;i<60;i++){const s=addDays(ms,-7*i),e=addDays(s,7);const n=logs.filter(l=>{const d=parseD(l.date);return d>=s&&d<e}).length;if(n>=t)streak++;else break}
  const prs=prsOf(id,since.getTime());const allPr=prsOf(id,0).length;
  const cheersIn=S.cheers.filter(c=>c.to===id).length;const vol=logs.reduce((a,l)=>a+(l.volume||0),0);
  const score=logs.length?Math.round(.4*weekPct+.3*attend+.3*completion):0;
  const badges=[['첫','첫 운동',logs.length>=1],['10','10회 출석',logs.length>=10],['30','30회 출석',logs.length>=30],['목','주간 목표 달성',streak>=1||wk>=t],['3주','3주 연속 달성',streak>=3],['PR','첫 기록 경신',allPr>=1],['PR5','기록 경신 5회',allPr>=5],['👏','칭찬 10개 받음',cheersIn>=10],['1만','누적 1만kg',vol>=10000]];
  return{wk,t,weekPct,attend,completion,streak,prs,allPr,cheersIn,vol,score,total:logs.length,badges}}

    h+=`</div><div class="row"><button class="btn sm" data-act="addset" data-e="${ei}">+ 세트</button>${en.sets.length>1?`<button class="btn sm ghost" data-act="delset" data-e="${ei}">− 세트</button>`:''}</div></section>`});

async function finishSession(){
  const s=S.session;const rt=clone(S.routines[S.me]);const d=rt.days.find(x=>x.key===s.dayKey);
  const entries=s.entries.map(en=>({ex:en.ex,target:en.target,sets:en.sets.filter(x=>x.done).map(x=>({w:+x.w||0,r:+x.r||en.target.max}))})).filter(en=>en.sets.length);
  const planned=s.entries.reduce((a,e)=>a+e.sets.length,0);
  const vol=entries.reduce((a,en)=>{const e=EX[en.ex];if(!e||e.k!=='load')return a;return a+en.sets.reduce((b,x)=>b+x.w*x.r*(e.per?2:1),0)},0);
  const changes=[];
  if(d)d.items=d.items.map(it=>{const en=s.entries.find(x=>x.ex===it.ex);if(!en)return it;const filled={...en,sets:en.sets.map(x=>({...x,r:x.r===''?(x.done?en.target.max:0):x.r}))};
    const p=progress(it,filled);if(!p)return it;changes.push({n:EX[it.ex]?.n||it.ex,msg:p.msg,tone:p.tone,next:targetText(p.item)});return p.item});
  const data={dayKey:s.dayKey,dayTitle:s.dayTitle,entries,planned,volume:Math.round(vol),durationMin:Math.max(1,Math.round((Date.now()-s.t0)/6e4)),note:String(s.note||'').slice(0,300),warm:!!s.warm,fin:!!s.fin};
  const ok=await act('gn_add_log',{p_date:s.date,p_data:data,p_routine:rt},'저장하고 가족에게 공유했어요');
  if(!ok){render();return}
  lsSet('gn_sess',null);S.session=null;S.timer=null;S.lastProg=changes;S.tab='me';S.meSeg='ach';S.view=S.me;lsSet('gn_tab','me');render();window.scrollTo(0,0)}

function barChart(data){const W=340,H=150,P=30,B=20;const mx=Math.max(1,...data.map(d=>d.v));const nice=niceMax(mx);const bw=(W-P-8)/data.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="주간 볼륨">`;
  [0,.5,1].forEach(f=>{const y=H-B-(H-B-10)*f;s+=`<line x1="${P}" x2="${W-4}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${P-4}" y="${y+4}" text-anchor="end" font-size="9" fill="var(--muted)">${fmtK(nice*f)}</text>`});
  data.forEach((d,i)=>{const h=(H-B-10)*d.v/nice;const x=P+4+i*bw;s+=`<rect x="${x}" y="${H-B-h}" width="${bw-8}" height="${Math.max(0,h)}" rx="3" fill="${i===data.length-1?'var(--me)':'color-mix(in srgb, var(--me) 45%, var(--sunk))'}"/><text x="${x+(bw-8)/2}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${d.lab}</text>`});
  return s+`</svg>`}
function lineChart(pts,unit){if(pts.length<2)return`<p class="small muted">기록이 2회 이상 쌓이면 추이가 보여요.${pts[0]?` 현재 ${fmtN(pts[0].w)}`:''}</p>`;
  const W=340,H=160,P=34,B=22;const ws=pts.map(p=>p.w);let lo=Math.min(...ws),hi=Math.max(...ws);if(lo===hi){lo=Math.max(0,lo-5);hi+=5}
  const x=i=>P+(W-P-12)*i/(pts.length-1),y=v=>10+(H-B-10)*(1-(v-lo)/(hi-lo));let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="무게 추이">`;
  [lo,(lo+hi)/2,hi].forEach(v=>{s+=`<line x1="${P}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P-4}" y="${y(v)+4}" text-anchor="end" font-size="9" fill="var(--muted)">${fmtN(Math.round(v*2)/2)}</text>`});
  const path=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.w).toFixed(1)}`).join('');
  s+=`<path d="${path} L${x(pts.length-1).toFixed(1)},${H-B} L${P},${H-B}Z" fill="color-mix(in srgb, var(--me) 14%, transparent)"/><path d="${path}" fill="none" stroke="var(--me)" stroke-width="2.2" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{const last=i===pts.length-1;s+=`<circle cx="${x(i)}" cy="${y(p.w)}" r="${last?4.5:2.5}" fill="${last?'var(--me)':'var(--surface)'}" stroke="var(--me)" stroke-width="1.5"/>`});
  const step=Math.ceil(pts.length/5);pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1)s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${p.d.slice(5).replace('-','/')}</text>`});
  return s+`<text x="${W-6}" y="10" text-anchor="end" font-size="9" fill="var(--muted)">${unit}</text></svg>`}
function niceMax(v){const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return(f<=1?1:f<=2?2:f<=5?5:10)*e}
function fmtK(v){return v>=1000?fmtN(Math.round(v/100)/10)+'k':fmtN(Math.round(v))}

   case'editSave':if(await act('gn_save_routine',{p_member:S.edit.member,p_data:S.edit.rt},'루틴을 저장했어요'))S.edit=null;break;
   case'rmItem':S.edit.rt.days[+a.dataset.d].items.splice(+a.dataset.i,1);break;
   case'addItem':{const di=+a.dataset.d;const id=$('#addsel_'+di).value;const p=P(S.view);const g=GOALS[p.goal]||GOALS['균형·체력'];const e=EX[id];
     S.edit.rt.days[di].items.push({ex:id,sets:g.sets,min:e.k==='time'?20:g.min,max:e.k==='time'?30:g.max,weight:estStart(id,p),rest:g.rest,est:true});break}
  }
  render()});
document.addEventListener('change',ev=>{const t=ev.target;const k=t.dataset.chk;if(!k)return;
  if(k==='warm'){S.session.warm=t.checked;saveDraft()}else if(k==='fin'){S.session.fin=t.checked;saveDraft()}
  else if(k==='ramp')S.edit.rt.ramp=t.checked;else if(k==='statEx'){S.statEx=t.value;render()}
  else if(k==='dow'){const d=S.edit.rt.days[+t.dataset.d];if(t.value)d.dow=t.value;else delete d.dow}});
let draftT;
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.dataset.in==='w'||t.dataset.in==='r'){S.session.entries[+t.dataset.e].sets[+t.dataset.s][t.dataset.in]=t.value.replace(/[^\d.]/g,'');clearTimeout(draftT);draftT=setTimeout(saveDraft,400)}
  else if(t.dataset.in==='note'){S.session.note=t.value;clearTimeout(draftT);draftT=setTimeout(saveDraft,400)}
  else if(t.dataset.in==='gq'){S.guideQ=t.value;render()}
  else if(t.dataset.ed){const it=S.edit.rt.days[+t.dataset.d].items[+t.dataset.i];const v=parseFloat(t.value);if(!isNaN(v)){it[t.dataset.ed]=t.dataset.ed==='weight'?v:Math.max(1,Math.round(v));delete it.est}}
  else if(t.id==='codeIn')S.login.code=t.value.replace(/\D/g,'')});
document.addEventListener('submit',async ev=>{ev.preventDefault();const f=ev.target;const v=id=>($('#'+id)?.value||'').trim();const num=id=>{const n=parseFloat(v(id));return isNaN(n)?null:n};
  if(f.dataset.form==='code'){S.login.code=v('codeIn').replace(/\D/g,'');S.login.busy=true;S.login.err='';render();
    try{S.login.list=await api('gn_family_members',{p_code:S.login.code});S.login.step=2}catch(e){S.login.err=e.msg}S.login.busy=false;render()}
  else if(f.dataset.form==='prof'){const m=M(S.view);const profile={...(m.profile||{}),sex:v('f_sex'),age:num('f_age'),height:num('f_height'),weight:num('f_weight'),bodyFat:num('f_bf'),level:v('f_level'),goal:v('f_goal'),days:+v('f_days'),minutes:+v('f_min'),env:v('f_env'),notes:v('f_notes').slice(0,500)};
    if(await act('gn_save_member',{p_id:S.view,p_name:v('f_name')||m.name,p_color:v('f_color'),p_profile:profile},'프로필을 저장했어요'))S.profEdit=false;render()}
  else if(f.dataset.form==='add'){const r=await act('gn_add_member',{p_name:v('a_name'),p_color:v('a_color')},'구성원을 추가했어요');if(r){S.addMember=false;S.view=r;S.meSeg='plan';S.profEdit=true}render()}
  else if(f.dataset.form==='cheer'){const msg=v('cm_'+f.dataset.log);if(!msg)return;if(await act('gn_cheer',{p_log:f.dataset.log,p_emoji:'💬',p_msg:msg},'칭찬을 보냈어요'))S.openMsg=null;render()}});

/* ---------- 시작 ---------- */
S.session=(()=>{const d=lsGet('gn_sess');return d&&d.member===S.me?d:null})();
if(S.token)load();else render();
setInterval(()=>{if(document.visibilityState==='visible'&&S.token)load(true)},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.token)load(true)});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
