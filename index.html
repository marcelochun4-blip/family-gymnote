function applySkin(tint){const sk=curSkin();const r=document.documentElement;r.dataset.skin=sk;
  if(sk==='clean'){r.style.setProperty('--me',tint||'var(--slate)')}else r.style.removeProperty('--me');
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{if(SKIN_BG[sk])m.setAttribute('content',SKIN_BG[sk]);else m.setAttribute('content',(m.getAttribute('media')||'').includes('dark')?'#111416':'#f4f5f3')})}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const parseD=s=>{const[a,b,c]=String(s).slice(0,10).split('-').map(Number);return new Date(a,(b||1)-1,c||1)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const roundTo=(v,inc)=>inc?Math.max(0,Math.round(v/inc)*inc):0;
const fmtN=v=>{const n=+v;return Number.isInteger(n)?String(n):n.toFixed(1).replace(/\.0$/,'')};
const clone=o=>JSON.parse(JSON.stringify(o));
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const md=s=>{const d=parseD(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+DOW[d.getDay()]+')'};
function unitOf(id){const e=EX[id];if(!e)return'';if(e.k==='time')return'초';if(e.k==='bw')return'회';if(e.k==='assist')return'보조kg';return e.per?'kg·한손':'kg'}
function targetText(it){const e=EX[it.ex];if(!e)return'';const reps=e.k==='time'?`${it.min}~${it.max}초`:`${it.min}~${it.max}회`;
  if(e.k==='load')return +it.weight?`${fmtN(it.weight)}kg${e.per?'(한손)':''} · ${it.sets}×${reps}`:`맨몸 · ${it.sets}×${reps}`;
  if(e.k==='assist')return`보조 ${fmtN(it.weight)}kg · ${it.sets}×${reps}`;
  return`${it.sets}×${reps}`}

function progress(it,entry){
  const e=EX[it.ex];const done=entry.sets.filter(s=>s.done);if(!done.length||!e)return null;
  const reps=done.map(s=>+s.r||0);const top=done.length>=entry.sets.length&&reps.every(r=>r>=it.max);const miss=reps.filter(r=>r<it.min).length>done.length/2;
  const n=clone(it);delete n.est;let msg='유지',tone='';
  if(e.k==='load'||e.k==='assist'){const good=done.filter(s=>(+s.r||0)>=it.min).map(s=>+s.w||0);const base=good.length?Math.max(...good):(+done[0].w||0);n.weight=base;
    if(e.k==='load'){if(top){n.weight=roundTo(base+e.inc,e.inc);msg=`+${fmtN(e.inc)}kg`;tone='good'}else if(miss){n.weight=Math.max(e.inc,roundTo(base-e.inc,e.inc));msg=`-${fmtN(e.inc)}kg`;tone='bad'}}
    else{if(top){n.weight=Math.max(0,base-e.inc);msg=`보조 -${e.inc}kg`;tone='good'}else if(miss){n.weight=base+e.inc;msg=`보조 +${e.inc}kg`;tone='bad'}}}
  else if(e.k==='time'){if(top){n.min+=5;n.max+=5;msg='+5초';tone='good'}}
  else if(top&&n.max<25){n.min+=2;n.max+=2;msg='+2회';tone='good'}

const FREEZE_EVERY=5,FREEZE_MAX=2;
function streakOf(id){
  const dates=new Set(logsOf(id).map(l=>String(l.date).slice(0,10)));const t=targetDays(id);const maxRest=t<=2?3:2;
  const td=today();const res={streak:0,best:0,freezes:0,days:{},todayDone:dates.has(td),todayState:'start',restLeft:0,nextFreezeIn:FREEZE_EVERY,total:0};
  if(!dates.size)return res;
  const first=[...dates].sort()[0];let d=parseD(first),streak=0,best=0,freezes=0,workouts=0,restRun=0;
  while(dstr(d)<=td){const s=dstr(d);
    if(dates.has(s)){streak++;workouts++;restRun=0;res.days[s]='fire';if(workouts%FREEZE_EVERY===0&&freezes<FREEZE_MAX)freezes++}
    else if(s===td){res.days[s]='today'}
    else if(streak===0){res.days[s]='none'}
    else{restRun++;if(restRun<=maxRest){streak++;res.days[s]='rest'}else if(freezes>0){freezes--;streak++;res.days[s]='freeze'}else{streak=0;restRun=0;res.days[s]='broken'}}
    best=Math.max(best,streak);d=addDays(d,1)}

  else if(streak===0)res.todayState='start';
  else if(restRun+1<=maxRest){res.todayState='rest';res.restLeft=maxRest-restRun-1}
  else if(freezes>0)res.todayState='freeze';
  else res.todayState='risk';

function ach(id){

  const since=addDays(new Date(),-27);since.setHours(0,0,0,0);const l28=logs.filter(l=>parseD(l.date)>=since);
  const attend=Math.min(100,Math.round(l28.length/(t*4)*100));
  let done=0,plan=0;l28.forEach(l=>{done+=(l.entries||[]).reduce((a,e)=>a+e.sets.length,0);plan+=+l.planned||(l.entries||[]).reduce((a,e)=>a+e.sets.length,0)});
  const completion=plan?Math.min(100,Math.round(done/plan*100)):0;
  let streak=0;for(let i=wk>=t?0:1;i<60;i++){const s=addDays(ms,-7*i),e=addDays(s,7);const n=logs.filter(l=>{const d=parseD(l.date);return d>=s&&d<e}).length;if(n>=t)streak++;else break}
  const prs=prsOf(id,since.getTime());const allPr=prsOf(id,0).length;
  const cheersIn=S.cheers.filter(c=>c.to===id).length;const vol=logs.reduce((a,l)=>a+(l.volume||0),0);

  const badges=[['첫','첫 운동',logs.length>=1],['10','10회 출석',logs.length>=10],['30','30회 출석',logs.length>=30],['목','주간 목표 달성',streak>=1||wk>=t],['3주','3주 연속 달성',streak>=3],['PR','첫 기록 경신',allPr>=1],['PR5','기록 경신 5회',allPr>=5],['👏','칭찬 10개 받음',cheersIn>=10],['1만','누적 1만kg',vol>=10000],['🔥7','7일 스트릭',streakOf(id).best>=7],['🔥30','30일 스트릭',streakOf(id).best>=30],['🔥100','100일 스트릭',streakOf(id).best>=100]];
  return{wk,t,weekPct,attend,completion,streak,prs,allPr,cheersIn,vol,score,total:logs.length,badges}}

function weekLogs(id,ms){ms=ms||monday(new Date());const e=addDays(ms,7);return S.logs.filter(l=>l.member===id&&parseD(l.date)>=ms&&parseD(l.date)<e)}
function nextDay(rt){if(!rt||!rt.days?.length)return null;const dow=DOW[new Date().getDay()];const byDow=rt.days.find(d=>d.dow===dow);if(byDow)return byDow;
  const last=logsOf(S.me).find(l=>rt.days.some(d=>d.key===l.dayKey));if(!last)return rt.days[0];const i=rt.days.findIndex(d=>d.key===last.dayKey);return rt.days[(i+1)%rt.days.length]}
function dotsFor(id,ms){const wl=weekLogs(id,ms);return [...Array(7)].map((_,i)=>{const d=addDays(ms,i);const s=dstr(d);return`<span class="${wl.some(l=>l.date===s)?'on':''} ${s===today()?'today':''}">${DOW[d.getDay()]}</span>`}).join('')}

function vHome(){

  let h=`<section class="card hero"><div class="row between"><div><div class="lbl">이번 주 ${esc(me.name)}</div><h2><span class="num">${a.wk}</span>/<span class="num">${a.t}</span>회 · 성취도 <span class="num">${a.score}</span>점</h2></div>${rt?`<span class="pill me">${weekOf(rt)}주차</span>`:''}</div><div class="weekdots">${dotsFor(S.me,ms)}</div>`;
  if(S.session)h+=`<button class="btn pri wide" data-act="tab" data-tab="work">진행 중인 운동 이어하기</button>`;
  else if(nd)h+=`<div><div class="lbl">다음 운동</div><div class="row between"><h3>${esc(nd.key)} · ${esc(nd.title)}</h3><span class="small muted">${nd.items.length}개 운동</span></div></div><button class="btn pri wide" data-act="start" data-day="${esc(nd.key)}">운동 시작</button>`;
  else h+=`<p class="muted">아직 루틴이 없어요. 기록 탭에서 프로필을 입력하고 루틴을 만드세요.</p><button class="btn pri wide" data-act="goPlan">루틴 만들기</button>`;
  h+=`</section>`+streakCard(S.me);
  const recv=S.cheers.filter(c=>c.to===S.me).slice(-6).reverse();const un=unseenCheers();
  if(recv.length)h+=`<section class="card"><div class="row between"><h3>받은 칭찬${un.length?` <span class="pill bad">새 ${un.length}</span>`:''}</h3>${un.length?`<button class="btn sm ghost" data-act="seenCheers">모두 확인</button>`:''}</div>
   <div class="fam">${recv.map(c=>{const f=M(c.from);const l=S.logs.find(x=>x.id===c.log);return`<div class="famrow" style="--c:${colorVar(f)}"><span class="plate sm"></span><div class="small"><b>${esc(f?.name||'')}</b> ${esc(c.emoji)} ${c.msg?esc(c.msg):''}<div class="muted">${l?md(l.date)+' '+esc(l.dayTitle||''):''}</div></div><span></span></div>`}).join('')}</div></section>`;
  // 가족 순위
  const rank=memberList().map(m=>({m,a:ach(m.id)})).sort((x,y)=>y.a.score-x.a.score);
  h+=`<section class="card"><div class="row between"><h3>가족 이번 주</h3><button class="btn sm ghost" data-act="tab" data-tab="fam">피드 보기</button></div><div class="fam">${rank.map(({m,a})=>`<div class="famrow" style="--c:${colorVar(m)}"><span class="plate sm"></span><div><div class="row between small"><b>${esc(m.name)} <span class="flm">🔥${streakOf(m.id).streak}</span></b><span class="muted">${a.wk}/${a.t}회 · 성취도 ${a.score}</span></div><div class="meter"><i style="width:${a.weekPct}%"></i></div></div><span class="num">${a.weekPct}%</span></div>`).join('')}</div></section>`;
  // 회복
  const now=Date.now(),lastBy={};logsOf(S.me).forEach(l=>(l.entries||[]).forEach(en=>{const p=EX[en.ex]?.p;if(p&&(lastBy[p]==null||l.ts>lastBy[p]))lastBy[p]=l.ts}));
  h+=`<section class="card"><div class="row between"><h3>부위별 회복</h3><span class="small muted">코어 24시간, 나머지 72시간 기준</span></div><div class="recov">${PARTS.map(p=>{const t=lastBy[p];const full=p==='코어'?24:72;const pct=t?Math.min(100,Math.round((now-t)/36e5/full*100)):100;const c=pct>=100?'var(--good)':pct>=60?'var(--warn)':'var(--bad)';return`<div><div class="row between small"><b>${p}</b><span class="num">${pct}%</span></div><div class="meter" style="--c:${c}"><i style="width:${pct}%"></i></div></div>`}).join('')}</div></section>`;
  return h}

  const rt=S.routines[S.me];if(S.session)return vSession();
  if(!rt)return`<div class="card"><div class="empty"><h3>루틴이 없어요</h3><p>기록 탭에서 루틴을 만든 뒤 여기서 시작하세요.</p></div><button class="btn pri" data-act="goPlan">루틴 만들기</button></div>`;

  return`<div class="row between"><h2>${esc(rt.title)}</h2><span class="pill me">${weekOf(rt)}주차${rt.ramp&&weekOf(rt)===1?' · 적응 세트':''}</span></div><div class="daylist">${rt.days.map(d=>`<section class="card ${nd&&nd.key===d.key?'hero':''}"><div class="row between"><div><div class="lbl">${esc(d.key)}${d.dow?' · '+esc(d.dow)+'요일':''}${nd&&nd.key===d.key?' · 다음 차례':''}</div><h3>${esc(d.title)}</h3>${d.focus?`<div class="small muted">${esc(d.focus)}</div>`:''}</div><button class="btn ${nd&&nd.key===d.key?'pri':''}" data-act="start" data-day="${esc(d.key)}">시작</button></div>
   ${d.items.map(it=>`<div class="exline"><span>${esc(EX[it.ex]?.n||it.ex)}</span><span class="num muted">${esc(targetText({...it,sets:effSets(it,rt)}))}</span></div>`).join('')}</section>`).join('')}</div>`}
function startSession(key){
  const rt=S.routines[S.me];const d=rt?.days.find(x=>x.key===key);if(!d)return;
  const draft=lsGet('gn_sess');
  if(draft&&draft.member===S.me&&draft.dayKey===key&&draft.date===today())S.session=draft;
  else S.session={member:S.me,dayKey:d.key,dayTitle:d.title,date:today(),t0:Date.now(),warm:false,fin:false,
    entries:d.items.map(it=>({ex:it.ex,target:{weight:it.weight,min:it.min,max:it.max,rest:it.rest},sets:[...Array(effSets(it,rt))].map(()=>({w:['load','assist'].includes(EX[it.ex]?.k)?it.weight:'',r:'',done:false}))}))};
  S.tab='work';lsSet('gn_tab','work');saveDraft();try{navigator.wakeLock?.request('screen').catch(()=>{})}catch(e){}render();window.scrollTo(0,0)}
function saveDraft(){lsSet('gn_sess',S.session)}
function vSession(){
  const s=S.session,rt=S.routines[S.me],d=rt?.days.find(x=>x.key===s.dayKey);
  const doneSets=s.entries.reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0),total=s.entries.reduce((a,e)=>a+e.sets.length,0);
  let h=`<section class="card hero"><div class="row between"><div><div class="lbl">${esc(s.dayKey)} · ${md(s.date)}</div><h2>${esc(s.dayTitle)}</h2></div><div class="num" style="font-size:24px">${doneSets}/${total}</div></div><div class="meter"><i style="width:${total?doneSets/total*100:0}%"></i></div><div class="small muted">${Math.round((Date.now()-s.t0)/6e4)}분 경과</div></section>`;
  if(d?.warmup)h+=`<label class="card" style="flex-direction:row;align-items:center"><input type="checkbox" id="warmChk" data-chk="warm" ${s.warm?'checked':''}><span><b>워밍업</b> · ${esc(d.warmup)}</span></label>`;
  s.entries.forEach((en,ei)=>{const e=EX[en.ex]||{n:en.ex,k:'load'};const allDone=en.sets.length&&en.sets.every(x=>x.done);
    const wl=e.k==='assist'?'보조kg':e.per?'kg·한손':'kg',rl=e.k==='time'?'초':'회';
    h+=`<section class="ex ${allDone?'done':''}"><div class="exhead">${hasImg(en.ex)?`<img class="thumb" src="${imgSrc(en.ex,0)}" alt="" loading="lazy">`:'<span class="thumb"></span>'}<div><h3>${esc(e.n)}</h3><div class="small muted">목표 ${esc(targetText({ex:en.ex,sets:en.sets.length,min:en.target.min,max:en.target.max,weight:en.target.weight}))} · 휴식 ${en.target.rest}초</div></div><button class="btn sm" data-act="howto" data-ex="${en.ex}">사용법</button></div><div class="sets">`;
    en.sets.forEach((st,si)=>{h+=`<div class="set"><span class="idx">${si+1}</span>${['load','assist'].includes(e.k)?`<div class="field"><input id="w_${ei}_${si}" inputmode="decimal" data-in="w" data-e="${ei}" data-s="${si}" value="${esc(st.w)}" aria-label="${si+1}세트 무게"><span>${wl}</span></div>`:`<div class="field"><span>맨몸</span></div>`}
      <div class="field"><input id="r_${ei}_${si}" inputmode="numeric" data-in="r" data-e="${ei}" data-s="${si}" value="${esc(st.r)}" placeholder="${en.target.max}" aria-label="${si+1}세트 ${rl}"><span>${rl}</span></div>
      <button class="check" data-act="setdone" data-e="${ei}" data-s="${si}" aria-pressed="${st.done}" aria-label="${si+1}세트 완료">✓</button></div>`});
    h+=`</div><div class="row"><button class="btn sm" data-act="addset" data-e="${ei}">+ 세트</button>${en.sets.length>1?`<button class="btn sm ghost" data-act="delset" data-e="${ei}">− 세트</button>`:''}</div></section>`});
  if(d?.finisher)h+=`<label class="card" style="flex-direction:row;align-items:center"><input type="checkbox" id="finChk" data-chk="fin" ${s.fin?'checked':''}><span><b>마무리</b> · ${esc(d.finisher)}</span></label>`;
  h+=`<div class="fl"><label for="sessNote">한마디 (가족 피드에 보여요)</label><textarea id="sessNote" data-in="note" placeholder="컨디션, 오늘의 느낌">${esc(s.note||'')}</textarea></div>
   <div class="grid2"><button class="btn danger" data-act="cancelSess">${S.confirm==='sess'?'정말 취소':'운동 취소'}</button><button class="btn pri" data-act="finish" ${doneSets&&!S.busy?'':'disabled'}>완료·가족에 공유</button></div>`;
  return h}
async function finishSession(){
  const s=S.session;const rt=clone(S.routines[S.me]);const d=rt.days.find(x=>x.key===s.dayKey);
  const entries=s.entries.map(en=>({ex:en.ex,target:en.target,sets:en.sets.filter(x=>x.done).map(x=>({w:+x.w||0,r:+x.r||en.target.max}))})).filter(en=>en.sets.length);
  const planned=s.entries.reduce((a,e)=>a+e.sets.length,0);
  const vol=entries.reduce((a,en)=>{const e=EX[en.ex];if(!e||e.k!=='load')return a;return a+en.sets.reduce((b,x)=>b+x.w*x.r*(e.per?2:1),0)},0);
  const changes=[];
  if(d)d.items=d.items.map(it=>{const en=s.entries.find(x=>x.ex===it.ex);if(!en)return it;const filled={...en,sets:en.sets.map(x=>({...x,r:x.r===''?(x.done?en.target.max:0):x.r}))};
    const p=progress(it,filled);if(!p)return it;changes.push({n:EX[it.ex]?.n||it.ex,msg:p.msg,tone:p.tone,next:targetText(p.item)});return p.item});
  const data={dayKey:s.dayKey,dayTitle:s.dayTitle,entries,planned,volume:Math.round(vol),durationMin:Math.max(1,Math.round((Date.now()-s.t0)/6e4)),note:String(s.note||'').slice(0,300),warm:!!s.warm,fin:!!s.fin};
  const st0=streakOf(S.me);
  const ok=await act('gn_add_log',{p_date:s.date,p_data:data,p_routine:rt});
  if(!ok){render();return}
  const st1=streakOf(S.me);setTimeout(()=>celebrate(st0.todayDone?st0.streak:st0.streak,st1,st1.freezes>st0.freezes||(st1.total%FREEZE_EVERY===0&&st0.freezes===FREEZE_MAX?false:st1.freezes>st0.freezes)),250);
  lsSet('gn_sess',null);S.session=null;S.timer=null;S.lastProg=changes;S.tab='me';S.meSeg='ach';S.view=S.me;lsSet('gn_tab','me');render();window.scrollTo(0,0)}

let tick;
function startTimer(sec){S.timer={end:Date.now()+sec*1000};clearInterval(tick);tick=setInterval(()=>{if(!S.timer){clearInterval(tick);return}
  if(Date.now()>=S.timer.end){S.timer=null;clearInterval(tick);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}toast('휴식 끝, 다음 세트!')}renderTimer()},250);renderTimer()}
function renderTimer(){const t=S.timer;if(!t||S.tab!=='work'){$('#timerSlot').innerHTML='';return}const left=Math.max(0,Math.ceil((t.end-Date.now())/1000));
  $('#timerSlot').innerHTML=`<div class="timer" role="timer"><span class="small">휴식</span><span class="num">${Math.floor(left/60)}:${pad(left%60)}</span><button data-act="tplus">+15초</button><button data-act="tskip">건너뛰기</button></div>`}

function postCard(l){
  const m=M(l.member);const mine=l.member===S.me;const cs=S.cheers.filter(c=>c.log===l.id);
  const byEmoji={};cs.forEach(c=>{(byEmoji[c.emoji]=byEmoji[c.emoji]||[]).push(c)});const msgs=cs.filter(c=>c.msg);
  const summary=(l.entries||[]).map(en=>{const e=EX[en.ex];if(!e)return'';const top=['load','assist'].includes(e.k)?Math.max(...en.sets.map(s=>+s.w||0)):null;return`${esc(e.n)} ${en.sets.length}세트${top!=null&&e.k==='load'?' · '+fmtN(top)+'kg':''}`}).join(', ');
  const prs=prsOf(l.member,l.ts).filter(p=>p.date===l.date);
  return`<article class="post" style="--c:${colorVar(m)}"><div class="row between"><div class="who2"><span class="plate"></span><div><b>${esc(m?.name||'')}</b><div class="small muted">${md(l.date)} · ${esc(l.dayKey||'')} ${esc(l.dayTitle||'')}</div></div></div><span class="small muted"><span class="num">${l.durationMin||0}</span>분 · <span class="num">${(l.volume||0).toLocaleString()}</span>kg</span></div>
   ${prs.length?`<div class="row">${prs.map(p=>`<span class="pill good">기록 경신 ${esc(EX[p.ex].n)} ${fmtN(p.prev)}→${fmtN(p.w)}kg</span>`).join('')}</div>`:''}
   <div class="small">${summary}</div>${l.note?`<div class="msg">${esc(l.note)}</div>`:''}
   <div class="reacts">${REACTS.map(r=>{const list=byEmoji[r]||[];const mineR=list.find(c=>c.from===S.me);return`<button class="react" ${mine?'disabled':''} data-act="${mineR?'unreact':'react'}" data-log="${l.id}" data-e="${r}" ${mineR?`data-id="${mineR.id}"`:''} aria-pressed="${!!mineR}">${r}${list.length?`<span class="num">${list.length}</span>`:''}</button>`}).join('')}
   ${Object.keys(byEmoji).length?`<span class="small muted" style="align-self:center">${[...new Set(cs.map(c=>M(c.from)?.name).filter(Boolean))].map(esc).join(', ')}</span>`:''}</div>
   ${msgs.length?`<div class="msgs">${msgs.map(c=>`<div class="msg"><b>${esc(M(c.from)?.name||'')}</b> ${esc(c.emoji)} ${esc(c.msg)}${c.from===S.me?` <button class="btn sm ghost" data-act="unreact" data-id="${c.id}" style="padding:0 6px">지우기</button>`:''}</div>`).join('')}</div>`:''}
   ${mine?'':(S.openMsg===l.id?`<form class="msgin" data-form="cheer" data-log="${l.id}"><input id="cm_${l.id}" maxlength="200" placeholder="칭찬 한마디"><button class="btn sm pri" type="submit">보내기</button></form>`:`<button class="btn sm ghost" data-act="openMsg" data-log="${l.id}" style="align-self:flex-start">칭찬 메시지 쓰기</button>`)}
  </article>`}
function vFam(){
  let h=`<div class="seg"><button data-act="famMode" data-m="day" aria-pressed="${S.famMode==='day'}">일간</button><button data-act="famMode" data-m="week" aria-pressed="${S.famMode==='week'}">주간</button><button data-act="famMode" data-m="all" aria-pressed="${S.famMode==='all'}">전체 피드</button></div>`;
  if(S.famMode==='day'){const d=S.famDate;const isT=d===today();
    h+=`<div class="row between"><button class="btn sm" data-act="famPrev">‹ 전날</button><h2>${isT?'오늘 ':''}${md(d)}</h2><button class="btn sm" data-act="famNext" ${isT?'disabled':''}>다음날 ›</button></div>`;
    memberList().forEach(m=>{const ls=S.logs.filter(l=>l.member===m.id&&l.date===d);
      if(ls.length)ls.forEach(l=>h+=postCard(l));else h+=`<div class="restday" style="--c:${colorVar(m)}"><span class="plate sm"></span><b>${esc(m.name)}</b> 기록 없음</div>`})}
  else if(S.famMode==='week'){const ms=parseD(S.famWeek);const me=addDays(ms,6);const isCur=dstr(ms)===dstr(monday(new Date()));
    h+=`<div class="row between"><button class="btn sm" data-act="wkPrev">‹ 지난주</button><h2>${md(dstr(ms))} ~ ${md(dstr(me))}</h2><button class="btn sm" data-act="wkNext" ${isCur?'disabled':''}>다음주 ›</button></div>`;
    h+=`<section class="card"><div style="overflow-x:auto"><div class="wtable"><span></span>${[...Array(7)].map((_,i)=>`<span class="h">${DOW[addDays(ms,i).getDay()]}</span>`).join('')}<span class="h">합계</span>
     ${memberList().map(m=>{const wl=weekLogs(m.id,ms);return`<b class="small">${esc(m.name)}</b>${[...Array(7)].map((_,i)=>{const s=dstr(addDays(ms,i));const l=wl.find(x=>x.date===s);return`<span class="c ${l?'on':''}" style="--c:${colorVar(m)}">${l?esc(l.dayKey||'✓'):''}</span>`}).join('')}<span class="num" style="text-align:center">${wl.length}/${targetDays(m.id)}</span>`}).join('')}</div></div></section>`;
    h+=`<section class="card"><h3>주간 요약</h3><div class="fam">${memberList().map(m=>{const wl=weekLogs(m.id,ms);const vol=wl.reduce((a,l)=>a+(l.volume||0),0);const mins=wl.reduce((a,l)=>a+(l.durationMin||0),0);const pct=Math.min(100,Math.round(wl.length/targetDays(m.id)*100));const cin=S.cheers.filter(c=>c.to===m.id&&wl.some(l=>l.id===c.log)).length;
      return`<div class="famrow" style="--c:${colorVar(m)}"><span class="plate sm"></span><div><div class="row between small"><b>${esc(m.name)}</b><span class="muted">${mins}분 · ${vol.toLocaleString()}kg · 칭찬 ${cin}</span></div><div class="meter"><i style="width:${pct}%"></i></div></div><span class="num">${pct}%</span></div>`}).join('')}</div></section>`;
    const wl=S.logs.filter(l=>parseD(l.date)>=ms&&parseD(l.date)<=me);h+=wl.length?wl.map(postCard).join(''):`<div class="empty">이 주에는 기록이 없어요.</div>`}
  else{const ls=S.logs.slice(0,40);h+=ls.length?ls.map(postCard).join(''):`<div class="card"><div class="empty"><h3>아직 가족 기록이 없어요</h3><p>누군가 운동을 저장하면 여기에 올라와요.</p></div></div>`}
  return h}

function vGuide(){
  const q=S.guideQ.trim();const list=Object.entries(EX).filter(([,e])=>(S.guidePart==='전체'||e.p===S.guidePart)&&(!q||e.n.includes(q)||e.eq.includes(q)));

function howtoSheet(id){const e=EX[id];const yt=ytLinks(id);

   <p class="small muted">기록 단위: ${unitOf(id)}${e.inc?` · 증량 단위 ${fmtN(e.inc)}kg`:''}</p>`}
function renderSheet(){const s=S.sheet;if(!s){$('#sheetSlot').innerHTML='';document.body.style.overflow='';return}
  $('#sheetSlot').innerHTML=`<div class="sheet" data-act="closeSheetBg"><div class="panel" role="dialog" aria-modal="true">${s.type==='howto'?howtoSheet(s.ex):''}</div></div>`;document.body.style.overflow='hidden'}

/* ---------- 기록(성취·히스토리·루틴) ---------- */
function vMe(){
  const vid=S.view||S.me;const m=M(vid);
  let h=`<div class="chips">${memberList().map(x=>`<button class="chip" data-act="view" data-id="${esc(x.id)}" aria-pressed="${x.id===vid}" style="--c:${colorVar(x)}"><span class="plate"></span>${esc(x.name)}${x.id===S.me?' (나)':''}</button>`).join('')}<button class="chip add" data-act="addMember">+ 구성원</button></div>`;
  if(S.addMember)return h+vAddMember();
  if(vid===S.me){const cur=curSkin();h+=`<section class="card"><div class="row between"><h3>내 테마</h3><span class="small muted">나만 바뀌어요</span></div><div class="skins">${SKINS.map(t=>`<button class="skin" data-act="skin" data-s="${t.id}" aria-pressed="${cur===t.id}"><span class="sw" style="background:${t.bg};color:${t.fg};${t.font?`font-family:${t.font};font-weight:400`:''}">${t.name}<span class="row" style="gap:4px">${t.dots.map(d=>`<i style="background:${d}"></i>`).join('')}</span></span><span class="small muted">${t.desc}</span></button>`).join('')}</div></section>`}
  h+=`<div class="seg"><button data-act="meSeg" data-s="ach" aria-pressed="${S.meSeg==='ach'}">성취도</button><button data-act="meSeg" data-s="hist" aria-pressed="${S.meSeg==='hist'}">운동 기록</button><button data-act="meSeg" data-s="plan" aria-pressed="${S.meSeg==='plan'}">루틴·프로필</button></div>`;
  if(S.meSeg==='ach')h+=vAch(vid);else if(S.meSeg==='hist')h+=vHist(vid);else h+=vPlan(vid);
  if(vid===S.me)h+=`<p class="small muted" style="text-align:center">앱 버전 ${APP_VER}</p><div class="row" style="justify-content:center"><button class="btn sm ghost" data-act="logout">${S.confirm==='logout'?'정말 로그아웃':'이 기기에서 로그아웃'}</button></div>`;
  return h}
function vAch(id){
  const a=ach(id);const m=M(id);let h=streakCard(id);
  if(id===S.me&&S.lastProg&&S.lastProg.length)h+=`<section class="card hero"><h3>다음 회차 목표</h3>${S.lastProg.map(c=>`<div class="exline"><span>${esc(c.n)} <span class="pill ${c.tone}">${esc(c.msg)}</span></span><span class="num muted">${esc(c.next)}</span></div>`).join('')}<button class="btn sm ghost" data-act="closeProg">닫기</button></section>`;
  h+=`<section class="card"><div class="row" style="flex-wrap:nowrap;gap:14px"><div class="ring" style="--p:${a.score}"><span>${a.score}</span></div><div class="stats3">
    <div class="stat"><span class="lbl">이번 주</span><span class="num">${a.weekPct}%</span><span class="small muted">${a.wk}/${a.t}회</span></div>
    <div class="stat"><span class="lbl">4주</span><span class="num">${a.attend}%</span><span class="small muted">출석</span></div>
    <div class="stat"><span class="lbl">세트</span><span class="num">${a.completion}%</span><span class="small muted">완수율</span></div></div></div>
    <p class="small muted">성취도 = 이번 주 달성 40% + 4주 출석 30% + 세트 완수율 30%</p>
    <div class="grid2"><div class="stat"><span class="lbl">연속 달성</span><span class="num">${a.streak}주</span></div><div class="stat"><span class="lbl">받은 칭찬</span><span class="num">${a.cheersIn}</span></div><div class="stat"><span class="lbl">총 운동</span><span class="num">${a.total}회</span></div><div class="stat"><span class="lbl">누적 볼륨</span><span class="num">${a.vol.toLocaleString()}kg</span></div></div></section>`;
  h+=`<section class="card"><h3>최근 4주 기록 경신</h3>${a.prs.length?a.prs.slice(-8).reverse().map(p=>`<div class="exline"><span>${esc(EX[p.ex].n)}</span><span class="num">${fmtN(p.prev)} → ${fmtN(p.w)}kg <span class="small muted">${md(p.date)}</span></span></div>`).join(''):'<p class="small muted">같은 운동을 두 번 이상 기록하면 무게가 오를 때 여기 표시돼요.</p>'}</section>`;
  h+=`<section class="card"><h3>배지</h3><div class="badges">${a.badges.map(([ic,n,on])=>`<div class="badge ${on?'on':''}"><span class="ico">${esc(ic)}</span><b>${esc(n)}</b></div>`).join('')}</div></section>`;
  // 볼륨 차트
  const logs=logsOf(id);if(logs.length){const wk=[];for(let i=7;i>=0;i--){const s=addDays(monday(new Date()),-i*7),e=addDays(s,7);wk.push({lab:(s.getMonth()+1)+'/'+s.getDate(),v:logs.filter(l=>{const d=parseD(l.date);return d>=s&&d<e}).reduce((a,l)=>a+(l.volume||0),0)})}
    h+=`<section class="card"><div class="row between"><h3>주간 볼륨</h3><span class="small muted">무게×회수, kg</span></div><div class="chart">${barChart(wk)}</div></section>`;
    const exIds=[...new Set(logs.flatMap(l=>(l.entries||[]).map(e=>e.ex)))].filter(x=>EX[x]&&['load','assist'].includes(EX[x].k));
    if(exIds.length){const sel=exIds.includes(S.statEx)?S.statEx:exIds[0];const pts=logs.slice().reverse().map(l=>{const en=(l.entries||[]).find(e=>e.ex===sel);if(!en||!en.sets.length)return null;const ws=en.sets.map(s=>+s.w||0);return{d:l.date,w:EX[sel].k==='assist'?Math.min(...ws):Math.max(...ws)}}).filter(Boolean);
      h+=`<section class="card"><div class="row between"><h3>무게 추이</h3><select id="statEx" data-chk="statEx" aria-label="운동 선택">${exIds.map(x=>`<option value="${x}" ${x===sel?'selected':''}>${EX[x].n}</option>`).join('')}</select></div><div class="chart">${lineChart(pts,EX[sel].k==='assist'?'보조kg (낮을수록 좋음)':(EX[sel].per?'kg·한손':'kg'))}</div></section>`}}
  return h}
function vHist(id){const logs=logsOf(id);
  if(!logs.length)return`<div class="card"><div class="empty"><h3>아직 기록이 없어요</h3><p>운동 탭에서 운동을 저장하면 여기에 쌓여요.</p></div></div>`;
  const start=addDays(monday(new Date()),-77);const set=new Set(logs.map(l=>l.date));const cells=[];for(let i=0;i<84;i++){const s=dstr(addDays(start,i));cells.push(`<i class="${set.has(s)?'on':''}" title="${s}"></i>`)}
  let h=`<section class="card"><h3>출석 12주</h3><div class="heat">${cells.join('')}</div></section><section class="card"><h3>최근 운동</h3>`;
  h+=logs.slice(0,30).map(l=>`<div class="log"><div class="row between"><b>${md(l.date)} · ${esc(l.dayKey||'')} ${esc(l.dayTitle||'')}</b><span class="small muted">${l.durationMin||0}분 · ${(l.volume||0).toLocaleString()}kg</span></div>
    <div class="small muted">${(l.entries||[]).map(en=>`${esc(EX[en.ex]?.n||en.ex)} ${en.sets.map(s=>['load','assist'].includes(EX[en.ex]?.k)?fmtN(s.w)+'×'+s.r:s.r).join(', ')}`).join(' / ')}</div>${l.note?`<div class="small">${esc(l.note)}</div>`:''}
    ${id===S.me?`<div>${S.confirm===l.id?`<button class="btn sm danger" data-act="delLog" data-id="${l.id}">정말 삭제</button> <button class="btn sm ghost" data-act="confirmOff">취소</button>`:`<button class="btn sm ghost" data-act="confirm" data-id="${l.id}">삭제</button>`}</div>`:''}</div>`).join('');
  return h+`</section>`}
function vPlan(id){
  const m=M(id),p=m.profile||{},rt=S.edit&&S.edit.member===id?S.edit.rt:S.routines[id];
  let h=`<section class="card"><div class="row between"><h2>${esc(m.name)} 프로필</h2><button class="btn sm" data-act="profToggle">${S.profEdit?'닫기':'수정'}</button></div>`;
  if(S.profEdit||!p.goal)h+=vProfForm(m);
  else h+=`<div class="row small">${[p.sex,p.age&&p.age+'세',p.height&&p.height+'cm',p.weight&&p.weight+'kg',p.bodyFat&&'체지방 '+p.bodyFat+'%',p.level,p.goal,'주 '+(p.days||3)+'회',(p.minutes||60)+'분',p.env].filter(Boolean).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>${p.notes?`<p class="small muted">${esc(p.notes)}</p>`:''}`;
  h+=`</section><section class="card"><h3>루틴 새로 만들기</h3><p class="small muted">나이·체중·수준·목표·주 횟수·시간·환경을 반영해 주간 루틴을 만들어요. 기존 루틴은 교체되고 기록은 그대로 남아요.</p>
   <button class="btn pri wide" data-act="genRule" ${S.busy?'disabled':''}>${S.busy?'만드는 중…':S.confirm==='gen'?'기존 루틴을 바꿀까요? 한 번 더 누르기':'빠른 생성 (프로필 기준)'}</button>${!p.goal?'<p class="small muted">목표를 선택하면 바로 만들 수 있어요. 위 프로필 칸에 입력한 값은 이 버튼을 누를 때 함께 저장돼요.</p>':''}</section>`;
  h+=vAI(id);
  if(!rt)return h+`<div class="card"><div class="empty"><h3>루틴이 아직 없어요</h3><p>위 버튼으로 첫 루틴을 만드세요.</p></div></div>`;
  const editing=!!(S.edit&&S.edit.member===id);
  h+=`<section class="card"><div class="row between"><div><div class="lbl">${rt.source==='rule'?'자동 생성':'직접 구성'} · ${esc(rt.startDate||'')} 시작 · ${weekOf(rt)}주차</div><h2>${esc(rt.title)}</h2></div>${editing?`<div class="row"><button class="btn sm ghost" data-act="editCancel">취소</button><button class="btn sm pri" data-act="editSave">저장</button></div>`:`<button class="btn sm" data-act="editStart">편집</button>`}</div>
   ${rt.notes?`<p class="small muted">${esc(rt.notes)}</p>`:''}${editing?`<label class="row small"><input type="checkbox" id="rampChk" data-chk="ramp" ${rt.ramp?'checked':''}> 1주차는 세트 1개 줄여 적응</label>`:''}</section>`;
  rt.days.forEach((d,di)=>{h+=`<section class="card"><div class="row between"><h3>${esc(d.key)} · ${esc(d.title)}</h3>${editing?`<select id="dow_${di}" data-chk="dow" data-d="${di}" aria-label="요일"><option value="">요일 없음</option>${DOW.map(x=>`<option ${d.dow===x?'selected':''}>${x}</option>`).join('')}</select>`:d.dow?`<span class="pill">${esc(d.dow)}요일</span>`:''}</div>`;
    if(editing){h+=`<div class="editrow edithead"><span>운동</span><span>세트</span><span>회·초</span><span>무게</span><span></span></div>`;
      d.items.forEach((it,ii)=>{const e=EX[it.ex];h+=`<div class="editrow"><span>${esc(e?.n||it.ex)}</span><input id="es_${di}_${ii}" data-ed="sets" data-d="${di}" data-i="${ii}" value="${it.sets}" inputmode="numeric" aria-label="세트">
        <span class="row" style="gap:2px;flex-wrap:nowrap"><input id="emi_${di}_${ii}" data-ed="min" data-d="${di}" data-i="${ii}" value="${it.min}" inputmode="numeric" aria-label="최소"><input id="ema_${di}_${ii}" data-ed="max" data-d="${di}" data-i="${ii}" value="${it.max}" inputmode="numeric" aria-label="최대"></span>
        ${e&&['load','assist'].includes(e.k)?`<input id="ew_${di}_${ii}" data-ed="weight" data-d="${di}" data-i="${ii}" value="${fmtN(it.weight)}" inputmode="decimal" aria-label="무게">`:'<span class="small muted">맨몸</span>'}<button class="x" data-act="rmItem" data-d="${di}" data-i="${ii}" aria-label="삭제">×</button></div>`});
      h+=`<div class="row"><select id="addsel_${di}" aria-label="추가할 운동">${GUIDE_PARTS.map(pp=>`<optgroup label="${pp}">${Object.entries(EX).filter(([,e])=>e.p===pp).map(([x,e])=>`<option value="${x}">${e.n} · ${e.eq}</option>`).join('')}</optgroup>`).join('')}</select><button class="btn sm" data-act="addItem" data-d="${di}">추가</button></div>`}
    else{h+=d.items.map(it=>`<div class="exline"><span>${esc(EX[it.ex]?.n||it.ex)}${it.note?`<span class="small muted"> · ${esc(it.note)}</span>`:''}${it.est?' <span class="pill warn">추정</span>':''}</span><span class="num muted">${esc(targetText(it))}</span></div>`).join('');
      if(d.warmup||d.finisher)h+=`<div class="small muted">${d.warmup?'워밍업: '+esc(d.warmup):''}${d.warmup&&d.finisher?'<br>':''}${d.finisher?'마무리: '+esc(d.finisher):''}</div>`}
    h+=`</section>`});
  if(!editing)h+=`<p class="small muted">운동을 저장하면 다음 회차 목표가 자동으로 바뀌어요. 모든 세트에서 최대 회수를 채우면 한 칸 증량, 절반 넘게 최소 회수에 못 미치면 한 칸 감량. '추정'은 아직 기록 전인 시작값이에요.</p>`;
  return h}
function vAI(id){const A=S.ai;
  let h=`<section class="card"><div><div class="lbl">AI 맞춤</div><h3>원하는 대로 루틴 요청하기</h3></div>
   <p class="small muted">하고 싶은 것, 피하고 싶은 것, 부상·통증을 자유롭게 쓰고 인바디 결과지 사진이나 PDF를 올리면 Claude가 함께 반영해서 만들어줘요. 완성되면 이 화면에 미리보기가 떠요.</p>
   <form data-form="ai" class="fl" style="gap:10px"><textarea id="aiPrompt" data-in="aiPrompt" placeholder="예) 무릎이 안 좋아서 점프·깊은 스쿼트는 빼고, 상체 위주로 주 4회. 팔뚝 살 빼고 싶어요." ${A.busy?'disabled':''}>${esc(A.prompt)}</textarea>
   <label class="btn" for="aiFile" style="text-align:center">${A.file?'📎 '+esc(A.file.name)+' ('+Math.round(A.file.size/1024)+'KB) · 바꾸기':'📎 인바디·검사지 사진 또는 PDF 올리기 (선택)'}</label>
   <input id="aiFile" type="file" accept="image/*,application/pdf" hidden>
   ${A.file?`<button type="button" class="btn sm ghost" data-act="aiClearFile" style="align-self:flex-start">첨부 빼기</button>`:''}
   <button class="btn pri wide" type="submit" ${A.busy?'disabled':''}>${A.busy?'보내는 중…':'Claude에게 루틴 요청'}</button></form>
   ${A.err?`<p class="small" style="color:var(--bad)">${esc(A.err)}</p>`:''}</section>`;
  const reqs=(S.aiReqs||[]).filter(r=>r.member===id);
  reqs.filter(r=>r.status==='pending').forEach(r=>{h+=`<section class="card"><div class="row between"><div><div class="lbl">AI 요청 접수됨 · ${md(dstr(new Date(r.ts)))}</div><h3>Claude가 루틴을 만드는 중</h3></div><span class="pill warn">대기</span></div>
    <p class="small muted">${esc((r.prompt||'').slice(0,120))}${r.file_name?' · 📎 '+esc(r.file_name):''}</p><p class="small muted">시완이 Claude 채팅에서 "짐노트 AI 요청 처리해줘"라고 하면 완성돼요.</p></section>`});
  let P0=A.preview;const doneReq=reqs.find(r=>r.status==='done'&&r.result);
  if(!P0&&doneReq){try{P0={member:id,req:doneReq.id,rt:aiNormalize(doneReq.result,P(id)),extracted:doneReq.result.extracted||{}}}catch(e){P0=null}}
  if(P0&&P0.member===id){const r=P0.rt,x=P0.extracted||{};
    h+=`<section class="card hero"><div class="lbl">Claude 제안 · 아직 저장 안 됨</div><h2>${esc(r.title)}</h2>${r.summary?`<p class="small">${esc(r.summary)}</p>`:''}
    ${(x.weight||x.bodyFat||x.muscle||x.other)?`<div class="notice"><b>첨부에서 읽은 값</b><br>${[x.weight&&'체중 '+x.weight+'kg',x.bodyFat&&'체지방률 '+x.bodyFat+'%',x.muscle&&'골격근량 '+x.muscle+'kg'].filter(Boolean).join(' · ')}${x.other?'<br>'+esc(x.other):''}
      ${(x.weight||x.bodyFat)?`<label class="row small" style="margin-top:6px"><input type="checkbox" id="aiApplyProf" data-chk="aiApplyProf" ${A.applyProf?'checked':''}> 이 값으로 프로필 체중·체지방률 업데이트</label>`:''}</div>`:''}
    ${r.days.map(d=>`<div><b>${esc(d.key)}${d.dow?' · '+esc(d.dow)+'요일':''} · ${esc(d.title)}</b>${d.focus?`<div class="small muted">${esc(d.focus)}</div>`:''}${d.items.map(it=>`<div class="exline"><span>${esc(EX[it.ex].n)}</span><span class="num muted">${esc(targetText(it))}</span></div>`).join('')}</div>`).join('')}
    ${r.notes?`<p class="small muted">${esc(r.notes)}</p>`:''}

function barChart(data){const W=340,H=150,P=30,B=20;const mx=Math.max(1,...data.map(d=>d.v));const nice=niceMax(mx);const bw=(W-P-8)/data.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="주간 볼륨">`;
  [0,.5,1].forEach(f=>{const y=H-B-(H-B-10)*f;s+=`<line x1="${P}" x2="${W-4}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${P-4}" y="${y+4}" text-anchor="end" font-size="9" fill="var(--muted)">${fmtK(nice*f)}</text>`});
  data.forEach((d,i)=>{const h=(H-B-10)*d.v/nice;const x=P+4+i*bw;s+=`<rect x="${x}" y="${H-B-h}" width="${bw-8}" height="${Math.max(0,h)}" rx="3" fill="${i===data.length-1?'var(--me)':'color-mix(in srgb, var(--me) 45%, var(--sunk))'}"/><text x="${x+(bw-8)/2}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${d.lab}</text>`});
  return s+`</svg>`}
function lineChart(pts,unit){if(pts.length<2)return`<p class="small muted">기록이 2회 이상 쌓이면 추이가 보여요.${pts[0]?` 현재 ${fmtN(pts[0].w)}`:''}</p>`;
  const W=340,H=160,P=34,B=22;const ws=pts.map(p=>p.w);let lo=Math.min(...ws),hi=Math.max(...ws);if(lo===hi){lo=Math.max(0,lo-5);hi+=5}
  const x=i=>P+(W-P-12)*i/(pts.length-1),y=v=>10+(H-B-10)*(1-(v-lo)/(hi-lo));let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="무게 추이">`;
  [lo,(lo+hi)/2,hi].forEach(v=>{s+=`<line x1="${P}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P-4}" y="${y(v)+4}" text-anchor="end" font-size="9" fill="var(--muted)">${fmtN(Math.round(v*2)/2)}</text>`});
  const path=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.w).toFixed(1)}`).join('');
  s+=`<path d="${path} L${x(pts.length-1).toFixed(1)},${H-B} L${P},${H-B}Z" fill="color-mix(in srgb, var(--me) 14%, transparent)"/><path d="${path}" fill="none" stroke="var(--me)" stroke-width="2.2" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{const last=i===pts.length-1;s+=`<circle cx="${x(i)}" cy="${y(p.w)}" r="${last?4.5:2.5}" fill="${last?'var(--me)':'var(--surface)'}" stroke="var(--me)" stroke-width="1.5"/>`});
  const step=Math.ceil(pts.length/5);pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1)s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${p.d.slice(5).replace('-','/')}</text>`});
  return s+`<text x="${W-6}" y="10" text-anchor="end" font-size="9" fill="var(--muted)">${unit}</text></svg>`}

    try{S.login.list=await api('gn_family_members',{p_code:S.login.code});S.login.step=2}catch(e){S.login.err=e.msg}S.login.busy=false;render()}
  else if(f.dataset.form==='prof'){const m=M(S.view);const profile={...(m.profile||{}),sex:v('f_sex'),age:num('f_age'),height:num('f_height'),weight:num('f_weight'),bodyFat:num('f_bf'),level:v('f_level'),goal:v('f_goal'),days:+v('f_days'),minutes:+v('f_min'),env:v('f_env'),notes:v('f_notes').slice(0,500)};
    if(await act('gn_save_member',{p_id:S.view,p_name:v('f_name')||m.name,p_color:v('f_color'),p_profile:profile},'프로필을 저장했어요'))S.profEdit=false;render()}
  else if(f.dataset.form==='add'){const r=await act('gn_add_member',{p_name:v('a_name'),p_color:v('a_color')},'구성원을 추가했어요');if(r){S.addMember=false;S.view=r;S.meSeg='plan';S.profEdit=true}render()}
  else if(f.dataset.form==='ai'){S.ai.prompt=($('#aiPrompt')?.value||'');if(!S.ai.prompt.trim()&&!S.ai.file){toast('원하는 내용을 쓰거나 파일을 올려주세요.');return}await runAI()}
  else if(f.dataset.form==='cheer'){const msg=v('cm_'+f.dataset.log);if(!msg)return;if(await act('gn_cheer',{p_log:f.dataset.log,p_emoji:'💬',p_msg:msg},'칭찬을 보냈어요'))S.openMsg=null;render()}});

/* ---------- 자동 업데이트 ---------- */
async function serverVer(){try{const r=await fetch('./version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return null;return (await r.json()).v||null}catch(e){return null}}
async function hardReload(v){try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}
  try{const r=await navigator.serviceWorker?.getRegistration();await r?.update()}catch(e){}
  location.replace(location.pathname+'?v='+encodeURIComponent(v||Date.now()))}
async function checkUpdate(manual){const v=await serverVer();
  if(!v||v===APP_VER){$('#updSlot').innerHTML='';if(manual)toast('최신 버전이에요');return false}
  const tried=lsGet('gn_upd_try')||{};const recent=tried.v===v&&Date.now()-tried.t<120000;
  if(manual||(!S.session&&!recent)){lsSet('gn_upd_try',{v,t:Date.now()});await hardReload(v);return true}
  $('#updSlot').innerHTML=`<div class="updbar">새 버전이 있어요<button data-act="doUpdate" data-v="${esc(v)}">${S.session?'운동 저장 후 적용':'지금 적용'}</button></div>`;return true}
/* ---------- 시작 ---------- */
S.session=(()=>{const d=lsGet('gn_sess');return d&&d.member===S.me?d:null})();
if(location.search.includes('v='))history.replaceState(null,'',location.pathname);
if(S.token)load();else render();
checkUpdate(false);
setInterval(()=>{if(document.visibilityState==='visible'){if(S.token)load(true);checkUpdate(false)}},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){checkUpdate(false);if(S.token)load(true)}});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
</script>
